<!doctype html><html lang='en'><head><meta charset='utf-8'><title>FX02 Ops Reports, report list</title><style>body{font-family:Arial,sans-serif;margin:24px}table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 8px}.sub td{font-style:italic;background:#eee}.bar{background:#26364d;color:#fff;padding:6px}.bar a{color:#fff}</style><script src='data.js'></script><script src='app.js'></script></head><body><div id="m">Loading...</div><script>
